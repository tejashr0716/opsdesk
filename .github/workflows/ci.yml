name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: opsdesk
          MYSQL_USER: opsdesk
          MYSQL_PASSWORD: opsdesk_local_only
          MYSQL_ROOT_PASSWORD: opsdesk_root_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uopsdesk -popsdesk_local_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: opsdesk
      DB_PASSWORD: opsdesk_local_only
      DB_NAME: opsdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.seed --small --with-indexes
      - run: pytest -q
